<!-- @dsCard group="Inputs" height=330 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Choice, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:24px">
<div class="sg" style="grid-template-columns:110px repeat(5,minmax(0,1fr))">
<span></span><span class="cap" style="margin:0">Off</span><span class="cap" style="margin:0">On</span><span class="cap" style="margin:0">Mixed</span><span class="cap" style="margin:0">Focus</span><span class="cap" style="margin:0">Disabled</span>
<span style="color:var(--text-2)">Checkbox</span><span><span style="width:16px;height:16px;border-radius:4px;box-sizing:border-box;border:1px solid var(--line-heavy);display:inline-block"></span></span><span><span style="width:16px;height:16px;border-radius:4px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" stroke="var(--primary-text)" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg></span></span><span><span style="width:16px;height:16px;border-radius:4px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center"><span style="width:8px;height:2px;border-radius:1px;background:var(--primary-text)"></span></span></span><span><span class="fr" style="width:16px;height:16px;border-radius:4px;box-sizing:border-box;border:1px solid var(--line-heavy);display:inline-block"></span></span><span><span style="width:16px;height:16px;border-radius:4px;box-sizing:border-box;border:1px solid var(--line-strong);background:var(--raised);opacity:.5"></span></span>
<span style="color:var(--text-2)">Toggle</span><span><span class="" style="position:relative;width:28px;height:16px;border-radius:8px;background:var(--line-heavy);display:inline-block;"><span style="position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text)"></span></span></span><span><span class="" style="position:relative;width:28px;height:16px;border-radius:8px;background:var(--primary);display:inline-block;"><span style="position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:var(--primary-text)"></span></span></span><span class="cap" style="margin:0">None</span><span><span class="fr" style="position:relative;width:28px;height:16px;border-radius:8px;background:var(--primary);display:inline-block;"><span style="position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:var(--primary-text)"></span></span></span><span><span class="" style="position:relative;width:28px;height:16px;border-radius:8px;background:var(--line-heavy);display:inline-block;opacity:.45;"><span style="position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text)"></span></span></span>
</div>
<div style="display:flex;gap:40px;flex-wrap:wrap;align-items:center">
<label style="display:flex;align-items:center;gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" stroke="var(--primary-text)" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg></span>Snapshot before applying changes</label>
<label style="display:flex;align-items:center;gap:10px"><span class="" style="position:relative;width:28px;height:16px;border-radius:8px;background:var(--primary);display:inline-block;"><span style="position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:var(--primary-text)"></span></span>Auto-start on host boot</label>
<div style="display:flex;padding:2px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"><span class="b bg" style="height:28px;padding:0 10px;border:0">CPU</span><span class="b" style="height:28px;padding:0 10px;border:0;box-shadow:0 0 0 1px var(--line-strong)">Memory</span><span class="b bg" style="height:28px;padding:0 10px;border:0">Disk</span><span class="b bg" style="height:28px;padding:0 10px;border:0">Network</span></div>
</div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
