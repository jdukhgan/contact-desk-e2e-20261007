<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandPalette, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
<div style="width:560px;background:var(--raised);box-shadow:var(--pop);border-radius:14px;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--text-3)" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg><span style="font-size:16px">snap</span><span class="kbd" style="margin-left:auto">esc</span></div>
<div style="padding:6px">
<div style="font-size:13px;color:var(--text-3);padding:8px 10px 4px">Actions</div>
<div class="mi" style="height:36px;background:var(--hover)">Take snapshot of hermes-agents<span class="kbd" style="margin-left:auto">↵</span></div>
<div class="mi" style="height:36px">Take snapshot of all machines on ms-a2<span style="margin-left:auto;font-size:13px;color:var(--text-3)">Needs approval</span></div>
<div style="font-size:13px;color:var(--text-3);padding:8px 10px 4px">Snapshots</div>
<div class="mi" style="height:36px">db-core, nightly<span class="mono" style="margin-left:auto;font-size:12px;color:var(--text-3)">02:04, 18.4 GiB</span></div>
<div class="mi" style="height:36px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12 6.6 8.4 3 7l3.6-1.4z"></path></svg>Ask agent about "snap"<span class="kbd" style="margin-left:auto">⌘ ↵</span></div>
</div></div>
<div style="width:400px;background:var(--raised);box-shadow:var(--pop);border-radius:14px;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--text-3)" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg><span style="font-size:16px">kubernetes</span></div>
<div style="padding:20px 16px;color:var(--text-2)">No results for "kubernetes".<div style="margin-top:12px"><span class="b bsm"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12 6.6 8.4 3 7l3.6-1.4z"></path></svg>Ask agent instead</span></div></div></div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
