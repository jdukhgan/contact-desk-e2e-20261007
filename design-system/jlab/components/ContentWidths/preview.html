<!doctype html>
<html>
<head><meta charset="utf-8"><title>ContentWidths, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:16px"><span style="width:160px;color:var(--text-2)">Overview</span><div style="height:10px;width:60%;border-radius:3px;background:var(--line-strong)"></div><span class="mono" style="color:var(--text-3)">960 px</span></div>
<div style="display:flex;align-items:center;gap:16px"><span style="width:160px;color:var(--text-2)">Detail</span><div style="height:10px;width:75%;border-radius:3px;background:var(--line-strong)"></div><span class="mono" style="color:var(--text-3)">1200 px, main plus 300 side column</span></div>
<div style="display:flex;align-items:center;gap:16px"><span style="width:160px;color:var(--text-2)">List and table</span><div style="height:10px;width:100%;border-radius:3px;background:var(--line-strong)"></div><span class="mono" style="color:var(--text-3)">full width</span></div>
<div style="display:flex;align-items:center;gap:16px"><span style="width:160px;color:var(--text-2)">Settings and forms</span><div style="height:10px;width:40%;border-radius:3px;background:var(--line-strong)"></div><span class="mono" style="color:var(--text-3)">640 px</span></div>
<div style="display:flex;align-items:center;gap:16px"><span style="width:160px;color:var(--text-2)">Docs and runbooks</span><div style="height:10px;width:44%;border-radius:3px;background:var(--line-strong)"></div><span class="mono" style="color:var(--text-3)">68 characters</span></div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
