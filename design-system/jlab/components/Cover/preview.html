<!doctype html>

<style>

.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg)}
.cv svg{position:absolute;left:0;top:0}
.ink{fill:var(--text)}
.blue{fill:var(--series-1)}
.grey{fill:var(--text-3)}
.live{fill:var(--running)}
.dot{fill:var(--line-heavy)}
.tile{rx:var(--radius-panel);ry:var(--radius-panel)}
.name{position:absolute;left:40px;bottom:58px;margin:0;font-family:var(--font-sans);font-weight:600;font-size:120px;line-height:.92;letter-spacing:-0.04em;color:var(--text)}
.tag{position:absolute;left:42px;bottom:28px;margin:0;max-width:440px;font-family:var(--font-sans);font-size:13px;line-height:20px;color:var(--text-2)}
