<!doctype html>
<html>
<head><meta charset="utf-8"><title>DateRange, preview</title></head>

<div class="pv">

<div style="background:var(--raised);box-shadow:var(--pop);border-radius:12px;display:flex;overflow:hidden">
<div style="padding:8px;border-right:1px solid var(--line);width:150px;display:flex;flex-direction:column;gap:2px">
<div class="mi">Last hour</div><div class="mi">Last 24 hours</div><div class="mi" style="background:var(--hover)">Last 7 days</div><div class="mi">Last 30 days</div><div class="mi" style="color:var(--text-2)">Custom</div></div>

<div style="display:grid;grid-template-columns:repeat(7,32px);gap:2px 0;font-size:12px;color:var(--text-3);text-align:center;margin-bottom:2px"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
<div style="display:grid;grid-template-columns:repeat(7,32px);gap:2px 0"><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;color:var(--text-3);opacity:.6">28</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;color:var(--text-3);opacity:.6">29</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;color:var(--text-3);opacity:.6">30</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">1</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">2</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">3</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line-heavy)">4</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">5</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">6</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">7</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;background:var(--primary);color:var(--primary-text);font-weight:600">8</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;background:var(--hover);border-radius:0">9</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;background:var(--hover);border-radius:0">10</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;background:var(--primary);color:var(--primary-text);font-weight:600">11</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">12</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">13</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">14</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">15</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">16</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">17</span><span class="mono" style="width:32px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;">18</span></div>
<div style="display:flex;gap:8px;margin-top:12px;align-items:center"><span class="inp mono" style="width:80px;height:28px;display:flex;align-items:center">00:00</span><span style="color:var(--text-3)">to</span><span class="inp mono" style="width:80px;height:28px;display:flex;align-items:center">23:59</span><span style="font-size:13px;color:var(--text-3)">GST</span></div>
</div></div>
<div class="cap" style="max-width:240px;margin:0">Today has a thin ring. Range ends are filled, days between take the hover layer. Out-of-month days are muted.</div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>

</html>
