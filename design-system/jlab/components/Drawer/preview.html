<!doctype html>
<html>
<head><meta charset="utf-8"><title>Drawer, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
<div style="position:relative;width:560px;height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)">
<div style="padding:16px 20px;color:var(--text-3)">Machines table behind</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,.35)"></div>
<div style="position:absolute;top:0;right:0;bottom:0;width:320px;background:var(--panel);box-shadow:-12px 0 32px rgba(0,0,0,.35);border-left:1px solid var(--line);display:flex;flex-direction:column">
<div style="display:flex;align-items:center;height:52px;padding:0 10px 0 16px;border-bottom:1px solid var(--line)"><span style="font-weight:550">Edit dev-main</span><span class="ib" style="margin-left:auto;width:26px;height:28px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></span></div>
<div style="padding:16px;display:flex;flex-direction:column;gap:14px;flex:1"><div><span class="lbl">Memory, GiB</span><input class="inp mono" value="16"></div><div><span class="lbl">CPU cores</span><input class="inp mono" value="4"></div></div>
<div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)"><span class="b bp">Save and restart</span><span class="b bg">Cancel</span></div></div></div>
<div style="display:flex;flex-direction:column;gap:20px">
<div class="menu" style="width:260px;padding:12px"><div style="font-weight:550;margin-bottom:10px">Rename snapshot</div><input class="inp" value="before-honcho-fix"><div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end"><span class="b bsm bg">Cancel</span><span class="b bsm bp">Rename</span></div></div>
<div class="menu" style="width:220px"><div class="mi">Open<span class="kbd" style="margin-left:auto">↵</span></div><div class="mi">Copy address<span class="kbd" style="margin-left:auto">⌘C</span></div><div class="mi">Take snapshot</div><div style="height:1px;background:var(--line);margin:4px 0"></div><div class="mi" style="color:var(--down-text)">Destroy</div></div>
</div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
