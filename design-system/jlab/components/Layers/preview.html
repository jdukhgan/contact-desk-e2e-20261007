<!doctype html>
<html>
<head><meta charset="utf-8"><title>Layers, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"><span class="mono" style="width:30px;color:var(--text-3)">0</span><span style="width:120px;font-weight:550">bg</span><span style="color:var(--text-2)">App background, sidebar, status line</span></div>
<div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line)"><span class="mono" style="width:30px;color:var(--text-3)">1</span><span style="width:120px;font-weight:550">panel</span><span style="color:var(--text-2)">Content panel, agent panel, boxes</span></div>
<div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;background:var(--raised);border:1px solid var(--line)"><span class="mono" style="width:30px;color:var(--text-3)">2</span><span style="width:120px;font-weight:550">raised</span><span style="color:var(--text-2)">Controls, hovered rows, sticky table headers</span></div>
<div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;background:var(--raised);box-shadow:var(--pop)"><span class="mono" style="width:30px;color:var(--text-3)">3</span><span style="width:120px;font-weight:550">popover</span><span style="color:var(--text-2)">Menus, tooltips, toasts, ⌘K palette</span></div>
<div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;background:var(--panel);box-shadow:var(--pop),0 0 0 100vmax rgba(0,0,0,0) inset"><span class="mono" style="width:30px;color:var(--text-3)">4</span><span style="width:120px;font-weight:550">modal</span><span style="color:var(--text-2)">Dialogs and drawers, over a 35% black scrim</span></div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
