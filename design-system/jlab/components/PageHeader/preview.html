<!-- @dsCard group="Shell" height=182 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>PageHeader, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:14px">
<div class="box" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 20px">
<span style="color:var(--text-3)">Machines</span><span style="color:var(--text-3)">/</span><span style="font-weight:550">hermes-agents</span>
<span style="display:inline-flex;align-items:center;gap:6px;color:var(--degraded);font-size:13px;margin-left:6px"><span class="dot" style="background:var(--degraded);width:6px;height:6px"></span>Degraded</span>
<span style="flex:1"></span>
<span style="font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--running);width:6px;height:6px"></span>Live, 4 s ago</span>
<div style="display:flex;padding:2px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"><span class="b bg" style="height:24px;padding:0 8px;border:0">1h</span><span class="b" style="height:24px;padding:0 8px;border:0;box-shadow:0 0 0 1px var(--line-strong)">24h</span><span class="b bg" style="height:24px;padding:0 8px;border:0">7d</span></div>
<span class="b">Console</span><span class="b bp">Restart</span>
<span class="ib" style="background:var(--hover);color:var(--text)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5l1.3 3.2 3.2 1.3-3.2 1.3L8 11.5 6.7 8.3 3.5 7l3.2-1.3z"></path></svg></span>
</div>
<div class="box" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 20px;color:var(--text-3)">
<span style="font-weight:550;color:var(--text-2)">mac-mini</span><span style="font-size:13px">Stale, last report 13:56</span><span style="flex:1"></span><span style="font-size:13px;display:flex;align-items:center;gap:6px"><span class="dot" style="box-shadow:inset 0 0 0 1.5px var(--text-3);width:6px;height:6px"></span>Not live</span><span class="b">Check agent</span>
</div>
<div class="cap" style="margin:0">Second row: the stale variant. The live dot becomes hollow and the time range is removed, because there is no live data to range over.</div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
