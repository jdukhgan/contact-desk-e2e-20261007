<!doctype html>
<html>
<head><meta charset="utf-8"><title>Progress, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:14px;align-items:center"><svg width="12" height="12" viewBox="0 0 12 12" aria-label="Loading"><circle cx="6" cy="6" r="4.4" fill="none" stroke="var(--text-3)" stroke-width="1.5" stroke-dasharray="16 10"></circle></svg><svg width="16" height="16" viewBox="0 0 16 16" aria-label="Loading"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--text-3)" stroke-width="1.8" stroke-dasharray="22 14"></circle></svg><svg width="20" height="20" viewBox="0 0 20 20" aria-label="Loading"><circle cx="10" cy="10" r="7.5" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-dasharray="28 18"></circle></svg></div><div class="cap" style="margin:0">12, 16, 20 px. Rotates at 700 ms per turn.</div></div>
<div style="width:280px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>Cloning kimo-platform</span><span class="mono" style="color:var(--text-3)">68%, 20 s left</span></div><div class="bar" style="margin-top:8px"><i style="width:68%;background:var(--info)"></i></div><div class="bar" style="margin-top:14px"><i style="width:30%;left:35%;background:var(--info);opacity:.8"></i></div><div class="cap">Determinate, then indeterminate when the length is unknown.</div></div>
<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:10px;align-items:center"><span class="mono" style="font-size:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hover);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box">8</span><span class="mono" style="font-size:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--degraded);color:#0E0F11;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-weight:600">2</span><span class="mono" style="font-size:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--down);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-weight:600">99+</span></div><div class="cap" style="margin:0">Counts: neutral, needs attention, failing.</div></div>
<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center"><span style="width:24px;height:24px;border-radius:50%;background:#EDEEF0;color:#0E0F11;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)">J</span><span style="margin-left:-6px"><span style="width:24px;height:24px;border-radius:50%;background:#7AA2FF;color:#0E0F11;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)">A</span></span><span style="margin-left:-6px"><span style="width:24px;height:24px;border-radius:50%;background:#4FC7C2;color:#0E0F11;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)">Cx</span></span><span style="margin-left:-6px"><span style="width:24px;height:24px;border-radius:50%;background:#B391FF;color:#0E0F11;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)">Cl</span></span></div><div class="cap" style="margin:0">You, the agent, Codex, Claude.</div></div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
