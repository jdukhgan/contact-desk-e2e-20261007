<!-- @dsCard group="Inputs" height=182 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Slider, preview</title></head>
<body>
<div class="pv">
<div class="sg" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:28px">
<div><div style="display:flex;justify-content:space-between"><span class="lbl">Memory</span><span class="mono">16 GiB</span></div>
<div style="position:relative;height:16px;margin-top:4px"><div style="position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--line-strong)"></div><div style="position:absolute;left:0;width:30%;top:6px;height:4px;border-radius:2px;background:var(--primary)"></div><div style="position:absolute;left:66%;top:2px;width:2px;height:12px;background:var(--degraded)"></div><span class="fr" style="position:absolute;left:30%;top:0;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.4)"></span></div>
<div class="mono" style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:6px"><span>1 GiB</span><span style="color:var(--degraded);margin-left:auto;margin-right:22%">36 GiB free</span><span>52 GiB</span></div></div>
<div><span class="lbl">CPU cores</span><div style="display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden"><span class="ib" style="border-radius:0;width:32px;height:32px">−</span><span class="mono" style="width:44px;text-align:center;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);line-height:30px">4</span><span class="ib" style="border-radius:0;width:32px;height:32px">+</span></div><div class="cap">Arrow keys step by 1, Shift by 4.</div></div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
