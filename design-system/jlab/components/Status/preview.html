<!doctype html>
<html>
<head><meta charset="utf-8"><title>Status, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-wrap:wrap;gap:28px"><span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-2)"><span class="dot" style="background:var(--running)"></span>Running</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--degraded)"><span class="dot" style="background:var(--degraded)"></span>Degraded</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--down)"><span class="dot" style="background:var(--down)"></span>Down</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-3)"><span class="dot" style="box-shadow:inset 0 0 0 1.5px var(--text-3)"></span>Stopped</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-3)"><span class="dot" style="box-shadow:inset 0 0 0 1.5px var(--text-3)"></span>Stale, 14 min</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--info)"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.6" fill="none" stroke="var(--info)" stroke-width="1.6" stroke-dasharray="14 8"></circle></svg>Snapshotting</span></div>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<span class="mono" style="font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-strong);color:var(--text-2)">VMID 104</span>
<span class="mono" style="font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-strong);color:var(--text-2)">10.0.10.24</span>
<span class="mono" style="font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-strong);color:var(--text-2)">debian-12</span>
<span style="font-size:12px;padding:2px 7px;border-radius:5px;background:var(--degraded-bg);color:var(--degraded);font-weight:500">1 issue</span>
<span style="font-size:12px;padding:2px 7px;border-radius:5px;background:var(--running-bg);color:var(--running);font-weight:500">Healthy</span>
<span class="cap" style="margin:0 0 0 8px">Tags: mono for identifiers, tinted only when they carry status.</span>
</div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
