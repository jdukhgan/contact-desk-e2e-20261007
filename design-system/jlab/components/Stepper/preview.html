<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stepper, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;gap:10px">
<span style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:var(--primary);display:inline-flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" stroke="var(--primary-text)" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg></span>Connect host</span><span style="flex:1;height:1px;background:var(--line-heavy)"></span>
<span style="display:flex;align-items:center;gap:8px;font-weight:550"><span class="mono" style="width:20px;height:20px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:12px">2</span>Add API token</span><span style="flex:1;height:1px;background:var(--line-strong)"></span>
<span style="display:flex;align-items:center;gap:8px;color:var(--text-3)"><span class="mono" style="width:20px;height:20px;border-radius:50%;box-sizing:border-box;border:1px solid var(--line-heavy);display:inline-flex;align-items:center;justify-content:center;font-size:12px">3</span>Choose what to watch</span><span style="flex:1;height:1px;background:var(--line-strong)"></span>
<span style="display:flex;align-items:center;gap:8px;color:var(--text-3)"><span class="mono" style="width:20px;height:20px;border-radius:50%;box-sizing:border-box;border:1px solid var(--line-heavy);display:inline-flex;align-items:center;justify-content:center;font-size:12px">4</span>Review</span>
</div>
<div class="box" style="overflow:hidden;max-width:640px">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5L6 7.5 9 4.5" stroke="var(--text)" stroke-width="1.4" fill="none"></path></svg><span style="font-weight:550">Networking</span><span style="margin-left:auto;font-size:13px;color:var(--text-3)">vmbr0, static</span></div>
<div style="padding:4px 16px 16px 38px;display:grid;grid-template-columns:1fr 1fr;gap:12px;border-bottom:1px solid var(--line)"><div><span class="lbl">Bridge</span><div class="inp" style="display:flex;align-items:center">vmbr0<span style="margin-left:auto"><svg width="12" height="12" viewBox="0 0 12 12" style="color:var(--text-3)" aria-hidden="true"><path d="M3 4.5L6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg></span></div></div><div><span class="lbl">Address</span><input class="inp mono" value="10.0.10.26/24"></div></div>
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)"><svg width="12" height="12" viewBox="0 0 12 12" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 3L7.5 6 4.5 9" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg><span style="font-weight:550">Backups</span><span style="margin-left:auto;font-size:13px;color:var(--text-3)">Nightly, keep 7</span></div>
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px"><svg width="12" height="12" viewBox="0 0 12 12" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 3L7.5 6 4.5 9" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg><span style="font-weight:550">Advanced</span><span style="margin-left:auto;font-size:13px;color:var(--text-3)">Defaults</span></div>
</div>
<div class="cap" style="margin:0">Each closed section summarises its current values on the right, so you don't have to open it to check.</div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
