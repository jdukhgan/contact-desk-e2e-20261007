<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast, preview</title></head>
<body>
<div class="pv">
<div style="display:flex;flex-direction:column;gap:10px;width:380px">
<div style="background:var(--raised);box-shadow:var(--pop);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 12 12" style="margin-top:3px" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="16 10"></circle></svg><div style="flex:1"><div style="font-weight:550">Snapshotting db-core</div><div style="font-size:13px;color:var(--text-2)">62%, about 1 min left</div><div class="bar" style="margin-top:8px"><i style="width:62%;background:var(--info)"></i></div></div></div>
<div style="background:var(--raised);box-shadow:var(--pop);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 16 16" style="margin-top:3px" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--running)"></circle><path d="M5 8.2l2 2 4-4.3" stroke="var(--primary-text)" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><div style="flex:1"><div style="font-weight:550">sandbox-gh started</div><div style="font-size:13px;color:var(--text-2)">Ready at 10.0.10.30 in 14 s</div></div><span class="b bsm bg">Undo</span></div>
<div style="background:var(--raised);box-shadow:var(--pop);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 16 16" style="margin-top:3px" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--down)"></circle><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="var(--primary-text)" stroke-width="1.6" stroke-linecap="round"></path></svg><div style="flex:1"><div style="font-weight:550">Couldn't start ragflow</div><div style="font-size:13px;color:var(--text-2)">Needs 16 GiB, ms-a2 has 12 GiB free.</div><div style="display:flex;gap:6px;margin-top:8px"><span class="b bsm">Free memory</span><span class="b bsm bg">Ask agent</span></div></div><span class="ib" style="width:22px;height:22px" aria-label="Dismiss"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4"></path></svg></span></div>
</div></div>
<script>/* Static preview: markup uses JLab classes from bundle.css and tokens from tokens.css. */</script>
</body>
</html>
